# Discord Plugin Configuration
# Tokens can also be set via environment variables:
#   DISCORD_BOT_TOKEN, DISCORD_USER_TOKEN

bot:
  token: ""

# null keeps legacy bot/chat_bridge settings until the Config page is saved.
# [] explicitly removes all configured bots. IDs stay unchanged on rename.
# Each bot has: id, name, token, enabled, servers, and chat_bridge settings.
bots: null

user:
  token: ""
  read_only: true

# Allowed server/guild IDs (empty = allow all)
servers: []

defaults:
  message_limit: 100
  insight_limit: 200
  member_sync_limit: 1000

memory:
  auto_save_summaries: true
  auto_save_insights: true
  export_format: "markdown"

persona:
  auto_sync_on_read: false
  track_activity: true

# Alert polling
polling:
  interval_minutes: 15
  auto_analyze_images: true

# Chat bridge — Discord as a chat frontend to Agent Zero
chat_bridge:
  auto_start: false
  # Channels are managed via the discord_chat tool, not config
  # Optional default model preset for the Discord bridge chat context.
  # Leave empty to use the system scoped default.
  default_preset: ""
  # Optional default agent profile for newly created Discord bridge contexts.
  # Leave empty to use the active system default profile.
  default_agent_profile: ""

  # User allowlist: only these Discord user IDs can interact with the bot.
  # Empty list = allow all server members. Get IDs via Discord Developer Mode.
  allowed_users: []

  # Full agent access is approved per user/channel in Config, not through secrets.

# Security — prompt injection defense
security:
  max_message_length: 4000
  max_bulk_input_chars: 200000
  sanitize_content: true
  strip_injection_patterns: true
