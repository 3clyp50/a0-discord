<html>
<head>
    <title>Discord</title>
    <script type="module">
        import { store } from "/plugins/discord/webui/discord-store.js";
    </script>
</head>
<body>
    <div x-data>
        <template x-if="$store.discordDashboard">
            <section class="discord-dashboard" x-init="$store.discordDashboard.refresh()" :aria-busy="$store.discordDashboard.busy">
                <header class="discord-heading">
                    <div>
                        <h3>Discord bots</h3>
                        <p>Separate bots, separate conversations. One Agent Zero.</p>
                    </div>
                    <div class="discord-actions">
                        <button type="button" class="button" @click="$store.discordDashboard.refresh()" :disabled="$store.discordDashboard.busy">
                            <x-icon name="refresh"></x-icon> Refresh
                        </button>
                        <button type="button" class="button" @click="$store.discordDashboard.configure()">Manage bots</button>
                    </div>
                </header>
                <p x-show="!$store.discordDashboard.loaded" role="status">Loading bots...</p>
                <p x-show="$store.discordDashboard.loaded &amp;&amp; !$store.discordDashboard.bots.length">No bots configured. Choose Manage bots to add one.</p>
                <div class="discord-bots">
                    <template x-for="bot in $store.discordDashboard.bots" :key="bot.id">
                        <article class="discord-bot">
                            <div class="discord-heading">
                                <div class="discord-bot-title">
                                    <h4 x-text="bot.user || bot.name"></h4>
                                    <span class="discord-muted" x-text="bot.user ? bot.name : 'Discord chat bridge'"></span>
                                </div>
                                <span class="discord-status" x-text="!bot.enabled ? 'Disabled' : !bot.configured ? 'Needs token' : bot.paused ? 'Paused' : bot.status" role="status"></span>
                            </div>
                            <dl class="discord-details">
                                <div><dt>Agent profile</dt><dd x-text="bot.profile || 'System default'"></dd></div>
                                <div><dt>Model preset</dt><dd x-text="bot.preset || 'System default'"></dd></div>
                                <div><dt>Servers joined</dt><dd x-text="bot.guilds ?? '-'"></dd></div>
                                <div><dt>Auto-start</dt><dd x-text="bot.auto_start ? 'On' : 'Off'"></dd></div>
                            </dl>
                            <div class="discord-actions">
                                <button type="button" class="button" @click="$store.discordDashboard.action(bot, 'start')" :disabled="$store.discordDashboard.busy || bot.running || !bot.enabled || !bot.configured">Start</button>
                                <button type="button" class="button" @click="$store.discordDashboard.action(bot, 'stop')" :disabled="$store.discordDashboard.busy || !bot.running">Stop</button>
                                <button type="button" class="button" @click="$store.discordDashboard.action(bot, 'restart')" :disabled="$store.discordDashboard.busy || !bot.enabled || !bot.configured">Restart</button>
                                <button type="button" class="button" @click="$store.discordDashboard.action(bot, 'test')" :disabled="$store.discordDashboard.busy || !bot.enabled || !bot.configured">Test connection</button>
                            </div>
                            <p class="discord-bot-id">Bot ID: <code x-text="bot.id"></code></p>
                        </article>
                    </template>
                </div>
                <footer class="discord-help">
                    Mention a bot with <strong>@</strong> or reply to its messages. Each bot can read channels and threads visible to both it and the requesting member.
                    Use <code>discord_chat</code> with a bot ID to register channels for replies to every message.
                    Stopping pauses auto-start until you start the bot again or restart Agent Zero.
                </footer>
            </section>
        </template>
    </div>
    <style>
        .discord-dashboard { font-family: var(--font-family-main); color: var(--color-text); padding: var(--spacing-md); }
        .discord-dashboard h3, .discord-dashboard h4 { margin: 0; color: var(--color-text); }
        .discord-dashboard h4 { font-size: 1rem; }
        .discord-dashboard p { margin: var(--spacing-xs) 0; }
        .discord-heading { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-md); flex-wrap: wrap; }
        .discord-heading p, .discord-muted, .discord-details dt, .discord-help, .discord-bot-id { color: var(--color-text-muted); font-size: .875rem; line-height: 1.5; }
        .discord-bots { display: grid; gap: var(--spacing-md); margin: var(--spacing-md) 0; }
        .discord-bot { min-width: 0; padding: var(--spacing-md); border: 1px solid var(--color-border); border-radius: var(--border-radius); background: var(--color-background); }
        .discord-bot-title { min-width: 0; overflow-wrap: anywhere; }
        .discord-status { padding: var(--spacing-xs) var(--spacing-sm); border: 1px solid var(--color-border); border-radius: var(--border-radius); background: var(--color-input); font-size: .8rem; text-transform: capitalize; }
        .discord-details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--spacing-sm) var(--spacing-md); margin: var(--spacing-md) 0; }
        .discord-details dd { margin: var(--spacing-xs) 0 0; overflow-wrap: anywhere; }
        .discord-actions { display: flex; gap: var(--spacing-sm); flex-wrap: wrap; }
        .discord-actions .button { display: inline-flex; align-items: center; justify-content: center; gap: var(--spacing-xs); margin: 0; font: inherit; }
        .discord-actions .button:focus-visible { outline: 2px solid var(--color-text); outline-offset: 2px; }
        .discord-actions .button:disabled { opacity: .5; cursor: not-allowed; }
        .discord-dashboard .discord-bot-id { margin-top: var(--spacing-md); overflow-wrap: anywhere; }
        .discord-help { border-top: 1px solid var(--color-border); padding-top: var(--spacing-md); }
        @media (max-width: 540px) {
            .discord-dashboard, .discord-bot { padding: var(--spacing-sm); }
            .discord-heading { align-items: flex-start; }
            .discord-actions { width: 100%; }
            .discord-actions .button { flex: 1 1 auto; }
        }
    </style>
</body>
</html>
