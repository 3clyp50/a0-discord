<html>
<head>
    <title>Discord</title>
    <script type="module">
        import { store } from "/plugins/discord/webui/discord-store.js";
    </script>
</head>
<body>
    <div x-data x-init="$store.discordDashboard.initConfig(config, context)">
        <template x-if="config &amp;&amp; Array.isArray(config.bots)">
            <div class="discord-config">
                <div class="section-title">Discord bots</div>
                <div class="section-description">Add one entry per Discord application. Each bot has its own token, access rules, model preset, agent profile and conversations. Names are local labels, not Discord renames. Save settings to apply changes.</div>
                <template x-for="(bot, index) in config.bots" :key="bot.id">
                    <details class="discord-config-bot" :open="config.bots.length === 1 || !bot.token">
                        <summary><span x-text="bot.name || 'New bot'"></span><span class="discord-config-id" x-text="bot.enabled ? 'Enabled' : 'Disabled'"></span></summary>
                        <div class="discord-config-body">
                            <div class="field">
                                <div class="field-label"><div class="field-title">Bot name</div><div class="field-description">Rename this label without losing existing chats.</div></div>
                                <div class="field-control"><input type="text" x-model="bot.name" aria-label="Bot name" placeholder="A0 Bug-Sweeper" /></div>
                            </div>
                            <div class="field">
                                <div class="field-label"><div class="field-title">Enabled</div><div class="field-description">Disabled bots disconnect and cannot be started.</div></div>
                                <div class="field-control"><label class="toggle"><input type="checkbox" x-model="bot.enabled" aria-label="Enable bot" /><span class="toggler"></span></label></div>
                            </div>
                <!-- Bot connection -->
                <div class="section-title">Bot Account (Primary)</div>
                <div class="section-description">
                    Create a bot at <a href="https://discord.com/developers/applications" target="_blank" rel="noopener">discord.com/developers</a> to get your token. Required for sending messages.
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Bot Token</div>
                        <div class="field-description">From the Discord Developer Portal. Required for all write operations.</div>
                    </div>
                    <div class="field-control">
                        <input type="password" x-model="bot.token" placeholder="Discord bot token" />
                    </div>
                </div>

                <!-- Servers -->
                <div class="section-title">Servers</div>
                <div class="section-description">
                    Restrict which Discord servers (guilds) the plugin can access. Leave empty to allow all servers the bot has joined.
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Allowed Server IDs</div>
                        <div class="field-description">One server/guild ID per line. Leave empty for all servers.</div>
                    </div>
                    <div class="field-control">
                        <textarea rows="3"
                            :value="(bot.servers || []).join('\n')"
                            @input="bot.servers = $event.target.value.split('\n').map(s => s.trim()).filter(Boolean)"
                            placeholder="Leave empty for all servers"></textarea>
                    </div>
                </div>

                <!-- Chat Bridge -->
                <div class="section-title">Chat Bridge</div>
                <div class="section-description">
                    Mention the bot with @ or reply to one of its messages. It can read server channels and threads visible to both it and the requesting user. Register a channel with <code>discord_chat</code> to receive replies to every message.
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Auto-start chat bridge</div>
                        <div class="field-description">Automatically connect the bot when Agent Zero starts. No registered channels are required. Saved settings are picked up within a minute. Stop on the Open page pauses this bot until manually started or Agent Zero restarts.</div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="bot.chat_bridge.auto_start" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Default model preset</div>
                        <div class="field-description">Use this model preset for new Discord bridge chats. Leave empty to use the system default.</div>
                    </div>
                    <div class="field-control">
                        <input type="text" x-model="bot.chat_bridge.default_preset" placeholder="Default" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Default agent profile</div>
                        <div class="field-description">Profile ID from Agent Editor, such as discord-sweeper. Used for new Discord bridge chats, including read-only mode. Leave empty for the system profile.</div>
                    </div>
                    <div class="field-control">
                        <select aria-label="Default agent profile" x-model="bot.chat_bridge.default_agent_profile">
                            <option value="">System default</option>
                            <template x-if="bot.chat_bridge.default_agent_profile &amp;&amp; !(context.discordProfiles || []).some(p => p.key === bot.chat_bridge.default_agent_profile)">
                                <option :value="bot.chat_bridge.default_agent_profile" x-text="bot.chat_bridge.default_agent_profile" selected></option>
                            </template>
                            <template x-for="profile in context.discordProfiles || []" :key="profile.key">
                                <option :value="profile.key" :selected="profile.key === bot.chat_bridge.default_agent_profile" x-text="profile.label"></option>
                            </template>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">User Allowlist</div>
                        <div class="field-description">Only these Discord users can interact with the bot. Leave empty to allow all server members. Get user IDs by enabling Developer Mode in Discord (Settings > Advanced), then right-click a user > Copy User ID.</div>
                    </div>
                    <div class="field-control">
                        <textarea rows="3"
                            :value="(bot.chat_bridge.allowed_users || []).join('\n')"
                            @input="bot.chat_bridge.allowed_users = $event.target.value.split('\n').map(s => s.trim()).filter(Boolean)"
                            placeholder="One user ID per line"></textarea>
                    </div>
                </div>

                <!-- Elevated mode -->
                <div class="section-title">Elevated Mode (2FA)</div>
                <div class="section-description">
                    When enabled, authenticated users can unlock full Agent Zero access from Discord using <code>!auth &lt;key&gt;</code>.
                    Default mode is read-only (Discord channel and thread reading, no system access or external writes).
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Allow elevated mode</div>
                        <div class="field-description">Grants authenticated users full agent access including code execution, file operations, and system tools.</div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="bot.chat_bridge.allow_elevated" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <template x-if="bot.chat_bridge.allow_elevated">
                    <div>
                        <div style="background: var(--bg-warning, #fce4ec); border: 1px solid var(--border-warning, #ef9a9a); border-radius: 6px; padding: 10px; margin-bottom: 12px;">
                            <div style="font-size: 12px; font-weight: 700; color: var(--text-error, #c62828); margin-bottom: 4px;">Security Notice</div>
                            <div style="font-size: 11px; color: var(--text-error, #b71c1c); line-height: 1.5;">
                                Elevated mode grants Discord users <strong>full access</strong> to Agent Zero's capabilities, including code execution, file operations, and system tools.
                                Before enabling, read the security section in the plugin's <strong>README.md</strong>.
                                <br><br>
                                <strong>Recommended:</strong> A private server with only trusted members, a defined User Allowlist above, and short session timeouts. Only allow users you deeply trust.
                            </div>
                        </div>

                        <div class="field">
                            <div class="field-label">
                                <div class="field-title">Auth Key</div>
                                <div class="field-description">Users send <code>!auth &lt;key&gt;</code> in Discord to elevate. The message is auto-deleted. Share this key securely.</div>
                            </div>
                            <div class="field-control" style="display: flex; gap: 6px; align-items: center;">
                                <input type="text" x-model="bot.chat_bridge.auth_key" readonly
                                    style="font-family: monospace; flex: 1;" />
                                <button type="button" class="btn btn-field" @click="context.generateDiscordKey(bot)">Generate</button>
                                <button type="button" class="btn btn-field" @click="context.copyDiscordKey(bot)">Copy</button>
                            </div>
                        </div>

                        <div class="field">
                            <div class="field-label">
                                <div class="field-title">Session Timeout</div>
                                <div class="field-description">How long elevated sessions last before requiring re-authentication.</div>
                            </div>
                            <div class="field-control">
                                <select x-model.number="bot.chat_bridge.session_timeout"
                                    x-init="if (bot.chat_bridge.session_timeout === undefined) bot.chat_bridge.session_timeout = 3600">
                                    <option value="3600">1 hour</option>
                                    <option value="7200">2 hours</option>
                                    <option value="14400">4 hours</option>
                                    <option value="28800">8 hours</option>
                                    <option value="43200">12 hours</option>
                                    <option value="86400">24 hours</option>
                                    <option value="0">Never expire</option>
                                </select>
                            </div>
                        </div>

                        <div x-show="bot.chat_bridge.session_timeout == 0"
                            style="background: var(--bg-warning, #fff3e0); border: 1px solid var(--border-warning, #ffcc80); border-radius: 6px; padding: 8px; font-size: 11px; color: var(--text-warning, #e65100);">
                            <strong>Security warning:</strong> "Never expire" means an elevated session stays active until the bot restarts or the user runs <code>!deauth</code>. If the auth key is compromised, the attacker retains full agent access indefinitely. Use with caution.
                        </div>
                    </div>
                </template>

                            <button type="button" class="btn btn-field" @click="$confirmClick($event, () => config.bots.splice(index, 1))">Remove bot</button>
                            <p class="field-description">Bot ID: <code x-text="bot.id"></code>. Removing a bot disconnects it after Save; saved chats are retained.</p>
                        </div>
                    </details>
                </template>
                <button type="button" class="btn btn-field" @click="context.addDiscordBot()">Add bot</button>
                <!-- User Account (Read-Only) -->
                <div class="section-title">User Account (Read-Only)</div>

                <div style="background: var(--bg-warning, #fff3e0); border: 1px solid var(--border-warning, #ffcc80); border-radius: 6px; padding: 10px; margin-bottom: 12px;">
                    <div style="font-size: 11px; color: var(--text-warning, #e65100); line-height: 1.5;">
                        User tokens are gated to read-only operations. Using a user token may violate Discord's Terms of Service. Use at your own risk.
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">User Token (Optional)</div>
                        <div class="field-description">For read-only access to servers the bot cannot join.</div>
                    </div>
                    <div class="field-control">
                        <input type="password" x-model="config.user.token" placeholder="User token for read-only access" />
                    </div>
                </div>

                <!-- Memory -->
                <div class="section-title">Memory</div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Auto-save summaries</div>
                        <div class="field-description">Automatically save conversation summaries to agent memory.</div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.memory.auto_save_summaries"
                                x-init="if (config.memory.auto_save_summaries === undefined) config.memory.auto_save_summaries = true" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Auto-save insights</div>
                        <div class="field-description">Automatically save channel insights to agent memory.</div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.memory.auto_save_insights"
                                x-init="if (config.memory.auto_save_insights === undefined) config.memory.auto_save_insights = true" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <!-- Persona -->
                <div class="section-title">Persona</div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Auto-sync personas on read</div>
                        <div class="field-description">Automatically build user personas when reading messages.</div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.persona.auto_sync_on_read" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <!-- Alert Polling -->
                <div class="section-title">Alert Polling</div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Polling interval (minutes)</div>
                        <div class="field-description">How often to check watched channels for new alerts (1-1440 minutes).</div>
                    </div>
                    <div class="field-control">
                        <input type="number" min="1" max="1440" x-model.number="config.polling.interval_minutes"
                            x-init="if (!config.polling.interval_minutes) config.polling.interval_minutes = 15" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Auto-analyze images in alerts</div>
                        <div class="field-description">Automatically analyze image attachments when processing alerts.</div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.polling.auto_analyze_images"
                                x-init="if (config.polling.auto_analyze_images === undefined) config.polling.auto_analyze_images = true" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>


            </div>
        </template>
    </div>
    <style>
        .discord-config-bot { margin: var(--spacing-md) 0; border: 1px solid var(--color-border); border-radius: var(--border-radius-sm); }
        .discord-config-bot > summary { cursor: pointer; padding: var(--spacing-md); overflow-wrap: anywhere; }
        .discord-config-bot > summary:focus-visible { outline: 2px solid var(--color-text); outline-offset: 2px; }
        .discord-config-id { margin-left: var(--spacing-sm); color: var(--color-text-muted); font-size: .85em; }
        .discord-config-body { padding: 0 var(--spacing-md) var(--spacing-md); }
        .discord-config-body code { overflow-wrap: anywhere; }
        @media (max-width: 540px) { .discord-config-body { padding: 0 var(--spacing-sm) var(--spacing-sm); } }
    </style>
</body>
</html>
