<html>
<head>
    <title>Discord</title>
    <script type="module">
        import { store } from "/plugins/discord/webui/discord-store.js";
    </script>
</head>
<body>
    <div x-data x-init="$store.discordConfig.initConfig(config, context)" x-destroy="$store.discordConfig.cleanup()">
        <template x-if="config &amp;&amp; Array.isArray(config.bots)">
            <div class="discord-config">
                <div class="discord-config-heading">
                    <div class="section-title">Discord</div>
                    <button type="button" class="btn btn-action" title="Refresh bot status" aria-label="Refresh bot status"
                        @click="$store.discordConfig.refresh()" :disabled="$store.discordConfig.busy || !!$store.discordConfig.busyBot || $store.discordConfig.scoped">
                        <x-icon name="refresh"></x-icon>
                    </button>
                </div>
                <div class="section-description">Connect one entry per Discord bot. Each has its own access rules, model preset, agent profile and conversations. Save settings to apply changes.</div>
                <div class="field-description" x-show="$store.discordConfig.scoped">Live bots are managed under Global / All profiles. These scoped settings apply to agent tools.</div>
                <template x-for="(bot, index) in config.bots" :key="bot.id">
                    <section class="discord-config-bot" x-data="{ expanded: config.bots.length === 1 || !bot.token }">
                        <div class="discord-bot-header">
                            <button type="button" class="discord-bot-toggle" :aria-expanded="expanded" @click="expanded = !expanded">
                                <span class="discord-bot-heading">
                                    <strong x-text="bot.name || 'New bot'"></strong>
                                    <span class="field-description" x-text="(bot.chat_bridge.default_agent_profile || 'Default profile') + ' / ' + (bot.chat_bridge.auto_start ? 'Auto-start' : 'Manual start')"></span>
                                </span>
                                <x-icon :name="expanded ? 'expand_less' : 'expand_more'"></x-icon>
                            </button>
                            <div class="discord-bot-actions">
                                <span class="discord-bot-status" role="status" x-text="$store.discordConfig.statusLabel(bot)"></span>
                                <template x-for="control in $store.discordConfig.controlsFor(bot)" :key="control.action === 'restart' ? 'restart' : 'toggle'">
                                    <button type="button" class="btn btn-action"
                                        :title="control.label + ($store.discordConfig.disabledReason(bot, control.action) ? ': ' + $store.discordConfig.disabledReason(bot, control.action) : '')"
                                        :aria-label="control.label + ' - ' + (bot.name || 'New bot')"
                                        :disabled="!!$store.discordConfig.disabledReason(bot, control.action)"
                                        @click="$store.discordConfig.action(bot, control.action)">
                                        <x-icon :name="control.icon"></x-icon>
                                    </button>
                                </template>
                                <button type="button" class="btn btn-action delete" title="Remove bot after saving"
                                    :aria-label="'Remove bot - ' + (bot.name || 'New bot')"
                                    :disabled="!!$store.discordConfig.busyBot"
                                    @click="$confirmClick($event, () => config.bots.splice(index, 1))">
                                    <x-icon name="delete"></x-icon>
                                </button>
                            </div>
                        </div>
                        <div class="discord-config-body" x-show="expanded">
                            <div class="field-description" x-show="$store.discordConfig.runtime(bot)?.user"
                                x-text="($store.discordConfig.runtime(bot)?.user || '') + ' / Servers joined: ' + ($store.discordConfig.runtime(bot)?.guilds || 0)"></div>
                            <div class="field">
                                <div class="field-label"><div class="field-title">Bot name</div><div class="field-description">Rename this label without losing existing chats.</div></div>
                                <div class="field-control"><input type="text" x-model="bot.name" aria-label="Bot name" placeholder="A0 Bug-Sweeper" /></div>
                            </div>
                            <div class="field field-full">
                                <div class="field-label">
                                    <div class="field-title">Instructions</div>
                                    <div class="field-description">Additional guidance for this bot, alongside its agent profile. Applies to new and existing chats in both access modes after Save. Does not grant tool access.</div>
                                </div>
                                <div class="field-control">
                                    <textarea rows="8" x-model="bot.chat_bridge.instructions" aria-label="Instructions"
                                        placeholder="Describe this bot's role, tone and workflows. Markdown is supported."></textarea>
                                </div>
                            </div>
                            <div class="field">
                                <div class="field-label"><div class="field-title">Enabled</div><div class="field-description">Disabled bots disconnect and cannot be started.</div></div>
                                <div class="field-control"><label class="toggle"><input type="checkbox" x-model="bot.enabled" aria-label="Enable bot" /><span class="toggler"></span></label></div>
                            </div>
                <!-- Bot connection -->
                <div class="section-title">Bot Account (Primary)</div>
                <div class="section-description">
                    Create a bot at <a href="https://discord.com/developers/applications" target="_blank" rel="noopener">discord.com/developers</a> to get your token. Required for sending messages.
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Bot Token</div>
                        <div class="field-description">From the Discord Developer Portal. Required for all write operations.</div>
                    </div>
                    <div class="field-control">
                        <input type="password" x-model="bot.token" placeholder="Discord bot token" />
                    </div>
                </div>

                <!-- Servers -->
                <div class="section-title">Servers</div>
                <div class="section-description">
                    Restrict which Discord servers (guilds) the plugin can access. Leave empty to allow all servers the bot has joined.
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Allowed Server IDs</div>
                        <div class="field-description">One server/guild ID per line. Leave empty for all servers.</div>
                    </div>
                    <div class="field-control">
                        <textarea rows="3"
                            :value="(bot.servers || []).join('\n')"
                            @input="bot.servers = $event.target.value.split('\n').map(s => s.trim()).filter(Boolean)"
                            placeholder="Leave empty for all servers"></textarea>
                    </div>
                </div>

                <!-- Chat Bridge -->
                <div class="section-title">Chat Bridge</div>
                <div class="section-description">
                    Mention the bot with @ or reply to one of its messages. It can read server channels and threads visible to both it and the requesting user. Register a channel with <code>discord_chat</code> to receive replies to every message.
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Auto-start chat bridge</div>
                        <div class="field-description">Automatically connect the bot when Agent Zero starts. No registered channels are required. Saved settings are picked up within a minute. Stop pauses this bot until manually started or Agent Zero restarts.</div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="bot.chat_bridge.auto_start" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Default model preset</div>
                        <div class="field-description">Use this model preset for new Discord bridge chats. Leave empty to use the system default.</div>
                    </div>
                    <div class="field-control">
                        <input type="text" x-model="bot.chat_bridge.default_preset" placeholder="Default" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Default agent profile</div>
                        <div class="field-description">Profile ID from Agent Editor, such as discord-sweeper. Used for new Discord bridge chats, including read-only mode. Leave empty for the system profile.</div>
                    </div>
                    <div class="field-control">
                        <select aria-label="Default agent profile" x-model="bot.chat_bridge.default_agent_profile">
                            <option value="">System default</option>
                            <template x-if="bot.chat_bridge.default_agent_profile &amp;&amp; !(context.discordProfiles || []).some(p => p.key === bot.chat_bridge.default_agent_profile)">
                                <option :value="bot.chat_bridge.default_agent_profile" x-text="bot.chat_bridge.default_agent_profile" selected></option>
                            </template>
                            <template x-for="profile in context.discordProfiles || []" :key="profile.key">
                                <option :value="profile.key" :selected="profile.key === bot.chat_bridge.default_agent_profile" x-text="profile.label"></option>
                            </template>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">User Allowlist</div>
                        <div class="field-description">Only these Discord users can interact with the bot. Leave empty to allow all server members. Get user IDs by enabling Developer Mode in Discord (Settings > Advanced), then right-click a user > Copy User ID.</div>
                    </div>
                    <div class="field-control">
                        <textarea rows="3"
                            :value="(bot.chat_bridge.allowed_users || []).join('\n')"
                            @input="bot.chat_bridge.allowed_users = $event.target.value.split('\n').map(s => s.trim()).filter(Boolean)"
                            placeholder="One user ID per line"></textarea>
                    </div>
                </div>

                <div class="discord-access" x-data="{ accessDuration: 3600 }">
                    <div class="section-title">Agent access</div>
                    <div class="section-description">
                        Unapproved users have read-only Discord access. Approve an exact user and channel here to enable tools for messages and slash commands. No keys are sent through Discord.
                    </div>
                    <p class="field-description">
                        <strong>Full agent access includes tools, code execution, files and external writes.</strong>
                        Approve only trusted users. Normal replies are visible to the channel; native /a0 replies remain private.
                        Approvals survive restarts until expiry or revocation. Revoke blocks new requests; stop an active run separately in its chat.
                    </p>
                    <div class="field">
                        <label class="field-label">
                            <span class="field-title">Approval duration</span>
                            <span class="field-description">Applies immediately when you approve a row. No settings Save is needed.</span>
                        </label>
                        <div class="field-control">
                            <select aria-label="Approval duration" x-model.number="accessDuration" :disabled="$store.discordConfig.scoped">
                                <option :value="3600">1 hour</option>
                                <option :value="28800">8 hours</option>
                                <option :value="86400">24 hours</option>
                                <option :value="0">Until revoked</option>
                            </select>
                        </div>
                    </div>
                    <p class="field-description" x-show="accessDuration === 0">
                        <strong>No automatic expiry.</strong> Access persists across restarts until you revoke it. Bot and user allowlists still apply.
                    </p>
                    <p class="field-description" x-show="!($store.discordConfig.runtime(bot)?.access || []).length">
                        No requests yet. Mention this bot, reply to it, or use /a0 in the intended channel, then refresh.
                    </p>
                    <template x-for="request in $store.discordConfig.runtime(bot)?.access || []" :key="request.request_id">
                        <div class="discord-access-row">
                            <div class="discord-access-identity">
                                <strong x-text="request.user_name + ' / #' + request.channel_name"></strong>
                                <span class="field-description" x-text="request.guild_name + ' / User: ' + request.user_id + ' / Channel: ' + request.channel_id"></span>
                                <span class="field-description" role="status" x-text="request.status + (request.expires_at === null ? ' / Until revoked' : request.expires_at ? ' / Until ' + new Date(request.expires_at * 1000).toLocaleString() : '')"></span>
                            </div>
                            <div class="discord-bot-actions">
                                <button type="button" class="btn btn-action discord-access-approve" :title="$store.discordConfig.accessDisabledReason(bot, 'approve') || (request.approved ? 'Renew approval' : 'Approve full agent access')"
                                    :aria-pressed="request.approved.toString()"
                                    :aria-label="(request.approved ? 'Renew approval for ' : 'Approve access for ') + request.user_name + ' in ' + request.channel_name"
                                    :disabled="!!$store.discordConfig.accessDisabledReason(bot, 'approve') || !request.eligible"
                                    @click="$confirmClick($event, () => $store.discordConfig.accessAction(bot, request, 'approve', accessDuration))">
                                    <x-icon name="check"></x-icon>
                                </button>
                                <button type="button" class="btn btn-action discord-access-revoke" title="Revoke agent access"
                                    :aria-pressed="(!request.approved).toString()"
                                    :aria-label="'Revoke access for ' + request.user_name + ' in ' + request.channel_name"
                                    :disabled="!!$store.discordConfig.accessDisabledReason(bot, 'revoke') || request.expires_at === 0"
                                    @click="$store.discordConfig.accessAction(bot, request, 'revoke')">
                                    <x-icon name="block"></x-icon>
                                </button>
                            </div>
                        </div>
                    </template>
                </div>

                <p class="field-description">Bot ID: <code x-text="bot.id"></code>. Removing a bot disconnects it after Save; saved chats are retained.</p>
                        </div>
                    </section>
                </template>
                <div class="discord-add-bot">
                    <button type="button" class="btn btn-field" @click="context.addDiscordBot()" x-text="config.bots.length ? 'Connect another bot' : 'Connect bot'"></button>
                    <div class="field-description">Save settings before starting a new bot.</div>
                </div>
                <div>
                <!-- User Account (Read-Only) -->
                <div class="section-title">User Account (Read-Only)</div>

                <div class="field-description">
                    <div>
                        User tokens are gated to read-only operations. Using a user token may violate Discord's Terms of Service. Use at your own risk.
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">User Token (Optional)</div>
                        <div class="field-description">For read-only access to servers the bot cannot join.</div>
                    </div>
                    <div class="field-control">
                        <input type="password" x-model="config.user.token" placeholder="User token for read-only access" />
                    </div>
                </div>

                <!-- Memory -->
                <div class="section-title">Memory</div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Auto-save summaries</div>
                        <div class="field-description">Automatically save conversation summaries to agent memory.</div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.memory.auto_save_summaries"
                                x-init="if (config.memory.auto_save_summaries === undefined) config.memory.auto_save_summaries = true" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Auto-save insights</div>
                        <div class="field-description">Automatically save channel insights to agent memory.</div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.memory.auto_save_insights"
                                x-init="if (config.memory.auto_save_insights === undefined) config.memory.auto_save_insights = true" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <!-- Persona -->
                <div class="section-title">Persona</div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Auto-sync personas on read</div>
                        <div class="field-description">Automatically build user personas when reading messages.</div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.persona.auto_sync_on_read" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <!-- Alert Polling -->
                <div class="section-title">Alert Polling</div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Polling interval (minutes)</div>
                        <div class="field-description">How often to check watched channels for new alerts (1-1440 minutes).</div>
                    </div>
                    <div class="field-control">
                        <input type="number" min="1" max="1440" x-model.number="config.polling.interval_minutes"
                            x-init="if (!config.polling.interval_minutes) config.polling.interval_minutes = 15" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Auto-analyze images in alerts</div>
                        <div class="field-description">Automatically analyze image attachments when processing alerts.</div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.polling.auto_analyze_images"
                                x-init="if (config.polling.auto_analyze_images === undefined) config.polling.auto_analyze_images = true" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>
                </div>
            </div>
        </template>
    </div>
    <style>
        .discord-config { display: flex; flex-direction: column; gap: var(--spacing-md); }
        .discord-config-heading { display: flex; align-items: center; gap: var(--spacing-md); }
        .discord-config-heading .section-title { flex: 1; }
        .discord-bot-header { display: flex; align-items: center; flex-wrap: wrap; gap: var(--spacing-sm) var(--spacing-md); padding: var(--spacing-sm) 0; border-bottom: 1px solid var(--color-border); }
        .discord-bot-toggle { display: flex; align-items: center; gap: var(--spacing-sm); flex: 1 1 12rem; min-width: 0; padding: 0; border: 0; background: transparent; color: var(--color-text); font: inherit; text-align: left; cursor: pointer; }
        .discord-bot-toggle:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 4px; }
        .discord-bot-heading { display: flex; flex-direction: column; gap: var(--spacing-xs); flex: 1; min-width: 0; overflow-wrap: anywhere; }
        .discord-bot-heading .field-description { margin: 0; }
        .discord-bot-actions { display: flex; align-items: center; flex-wrap: wrap; gap: var(--spacing-xs); }
        .discord-bot-status { font-size: var(--font-size-small); color: var(--color-text-secondary); margin-right: var(--spacing-sm); }
        .discord-config-body { padding: var(--spacing-sm) 0; }
        .discord-config .section-title { margin-top: var(--spacing-md); }
        .discord-config .section-description { margin-bottom: var(--spacing-md); }
        .discord-config-heading .section-title { margin-top: 0; }
        .discord-config .field-control { min-width: 0; }
        .discord-config .field.field-full { grid-template-columns: 1fr; gap: var(--spacing-sm); }
        .discord-config code { overflow-wrap: anywhere; }
        .discord-access-row { display: flex; align-items: center; flex-wrap: wrap; gap: var(--spacing-md); padding: var(--spacing-sm) 0; border-bottom: 1px solid var(--color-border); }
        .discord-access-identity { display: flex; flex-direction: column; gap: var(--spacing-xs); flex: 1 1 16rem; min-width: 0; overflow-wrap: anywhere; }
        .discord-access-identity .field-description { margin: 0; }
        .discord-access-approve { --discord-access-color: var(--color-success, #16a34a); }
        .discord-access-revoke { --discord-access-color: var(--color-error, #dc2626); }
        .discord-access-row .btn-action[aria-pressed="true"] {
            color: var(--discord-access-color);
            border-color: var(--discord-access-color);
            background: color-mix(in srgb, var(--discord-access-color) 18%, transparent);
            box-shadow: inset 0 0 0 1px var(--discord-access-color);
            opacity: 1;
        }
        .discord-config .btn-action { flex-shrink: 0; }
        .discord-add-bot { padding-top: var(--spacing-sm); }
        .discord-add-bot .field-description { margin-top: var(--spacing-sm); }
        @media (max-width: 640px) {
            .discord-bot-toggle { flex-basis: 100%; }
            .discord-bot-actions { width: 100%; }
            .discord-bot-status { margin-right: auto; }
            .discord-config .field { grid-template-columns: 1fr; gap: var(--spacing-xs); }
        }
    </style>
</body>
</html>
